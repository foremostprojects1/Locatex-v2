# Local dependencies only — the API and worker run on the host with pnpm dev / pnpm worker.
services:
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: ['locatex-mongo:/data/db']
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  # A single-node replica set, because transactions (used by submit and approve) require one.
  mongo-init:
    image: mongo:7
    depends_on: { mongo: { condition: service_healthy } }
    restart: 'no'
    entrypoint:
      [
        'bash',
        '-c',
        "mongosh --host mongo:27017 --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) }'",
      ]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['locatex-redis:/data']

volumes:
  locatex-mongo:
  locatex-redis:
