name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: locatex/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: locatex
      - run: pnpm lint
        working-directory: locatex
      - run: pnpm typecheck
        working-directory: locatex
      - run: pnpm test
        working-directory: locatex
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          JWT_SECRET: ci-secret-that-is-at-least-32-characters

      # "It compiles" is not "it boots and serves". This builds the real artefacts, starts
      # the server as a host would, and checks the single deployable unit still works.
      - run: pnpm build
        working-directory: locatex
      - run: pnpm verify:deployable
        working-directory: locatex
